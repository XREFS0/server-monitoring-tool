REFRESH_INTERVAL=2

CPU_WARNING_THRESHOLD=75
CPU_CRITICAL_THRESHOLD=90

RAM_WARNING_THRESHOLD=80
RAM_CRITICAL_THRESHOLD=95

SWAP_WARNING_THRESHOLD=50
SWAP_CRITICAL_THRESHOLD=80

DISK_WARNING_THRESHOLD=80
DISK_CRITICAL_THRESHOLD=95

LOAD_WARNING_MULTIPLIER=1.0
LOAD_CRITICAL_MULTIPLIER=2.0

TEMP_WARNING_THRESHOLD=70
TEMP_CRITICAL_THRESHOLD=85

LOGGING_ENABLED=0
LOG_FILE="/var/log/server-monitor.log"

MONITORED_SERVICES="sshd nginx apache2 mysql postgresql docker"
